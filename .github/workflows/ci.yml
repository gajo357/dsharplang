name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  documentation-and-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: trusted/global.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      # One-time, exact migration of the obsolete typed-parameter assertion.
      # All other trusted test content remains byte-for-byte from the base.
      - name: Reconcile the reviewed parameter fixture
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: node candidate/.github/ai/migrate-parameter-fixture.mjs trusted candidate "$BASE_SHA"
      - name: Verify candidate with the base harness when available
        run: |
          if [[ -f trusted/.github/ai/bootstrap.sh && -f trusted/.github/ai/verify.sh ]]; then
            bash trusted/.github/ai/bootstrap.sh
            bash trusted/.github/ai/verify.sh "$GITHUB_WORKSPACE/candidate"
          elif [[ ! -e trusted/.github/ai ]]; then
            echo '::notice::Base revision predates the verification harness; proposed automation validation is required below.'
          else
            echo '::error::Base verification harness is incomplete.'
            exit 1
          fi
      # On automation changes, exercise the proposed harness as well, without secrets/write permissions.
      - name: Validate proposed automation
        run: bash candidate/.github/ai/bootstrap.sh && bash candidate/.github/ai/verify.sh
      - name: Exercise proposed compiler verifier pilots
        run: node candidate/.github/ai/pilot.mjs "${{ runner.temp }}/pilot-reports"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: compiler-verifier-pilots
          path: ${{ runner.temp }}/pilot-reports/
          if-no-files-found: error
          retention-days: 14
