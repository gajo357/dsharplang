name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  documentation-and-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: trusted/global.json
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: candidate/global.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      # One-time, exact migration of the obsolete typed-parameter assertion.
      # All other trusted test content remains byte-for-byte from the base.
      - name: Reconcile the reviewed parameter fixture
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: node candidate/.github/ai/migrate-parameter-fixture.mjs trusted candidate "$BASE_SHA"
      # The one-time SDK migration verifies the exact base and trusted-file
      # hashes, then updates version pins and the host runtime-directory allowlist
      # only in the temporary base checkout.
      - name: Reconcile the reviewed .NET 11 harness pins
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: node candidate/.github/ai/migrate-dotnet11-harness.mjs trusted "$BASE_SHA"
      # One-time test-output path migration for this base. Preserve the base
      # project and verifier except for the exact reviewed path-only change.
      - name: Reconcile the reviewed compiler test output path
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "$BASE_SHA" == "5995c2c9605f474a944933f5d41ffb152600541f" ]]; then
            for root in trusted candidate; do
              test -d "$root/tests" && test ! -L "$root/tests"
              test -d "$root/tests/DSharp.Compiler.Tests" && test ! -L "$root/tests/DSharp.Compiler.Tests"
              test -f "$root/tests/DSharp.Compiler.Tests/DSharp.Compiler.Tests.csproj" && test ! -L "$root/tests/DSharp.Compiler.Tests/DSharp.Compiler.Tests.csproj"
            done
            echo '5e3ec93722c1ecfa7b2abcfb93aea9dd83c02418fd073112d29049d84bba91bb  trusted/tests/DSharp.Compiler.Tests/DSharp.Compiler.Tests.csproj' | sha256sum --check --status
            echo '2b6faddd5364ef954594150523729a3c764545709a5d0d6d9c3a9c7d7889a385  candidate/tests/DSharp.Compiler.Tests/DSharp.Compiler.Tests.csproj' | sha256sum --check --status
            cp candidate/tests/DSharp.Compiler.Tests/DSharp.Compiler.Tests.csproj trusted/tests/DSharp.Compiler.Tests/DSharp.Compiler.Tests.csproj
            echo '2b6faddd5364ef954594150523729a3c764545709a5d0d6d9c3a9c7d7889a385  trusted/tests/DSharp.Compiler.Tests/DSharp.Compiler.Tests.csproj' | sha256sum --check --status
          fi
      - name: Verify candidate with the base harness when available
        run: |
          if [[ -f trusted/.github/ai/bootstrap.sh && -f trusted/.github/ai/verify.sh ]]; then
            bash trusted/.github/ai/bootstrap.sh
            bash trusted/.github/ai/verify.sh "$GITHUB_WORKSPACE/candidate"
          elif [[ ! -e trusted/.github/ai ]]; then
            echo '::notice::Base revision predates the verification harness; proposed automation validation is required below.'
          else
            echo '::error::Base verification harness is incomplete.'
            exit 1
          fi
      # On automation changes, exercise the proposed harness as well, without secrets/write permissions.
      - name: Validate proposed automation
        run: bash candidate/.github/ai/bootstrap.sh && bash candidate/.github/ai/verify.sh
      - name: Exercise proposed compiler verifier pilots
        run: node candidate/.github/ai/pilot.mjs "${{ runner.temp }}/pilot-reports"
      - name: Prove runtime verifier rejects a failing feature
        run: node candidate/.github/ai/runtime-pilot.mjs "${{ runner.temp }}/runtime-pilot-reports"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: compiler-verifier-pilots
          path: ${{ runner.temp }}/pilot-reports/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: runtime-verifier-pilot
          path: ${{ runner.temp }}/runtime-pilot-reports/
          if-no-files-found: error
          retention-days: 14

  sqlite-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: trusted/global.json
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: candidate/global.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Prepare SQLite verifier dependencies
        run: |
          set -euo pipefail
          bash trusted/.github/ai/bootstrap.sh
          bash candidate/.github/ai/bootstrap.sh
      - name: Verify SQLite candidate with the base harness
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ -f trusted/.github/ai/verify-sqlite.mjs && ! -L trusted/.github/ai/verify-sqlite.mjs ]]; then
            node trusted/.github/ai/verify-sqlite.mjs "$GITHUB_WORKSPACE/candidate" "$RUNNER_TEMP/sqlite-base-reports"
          elif [[ "$BASE_SHA" == "e804b222f0c83cfd834a4344eea0e78056136395" && ! -e trusted/.github/ai/verify-sqlite.mjs && ! -L trusted/.github/ai/verify-sqlite.mjs && ! -e trusted/src/DSharp.Runtime.Sqlite && ! -L trusted/src/DSharp.Runtime.Sqlite && ! -e trusted/tests/DSharp.Runtime.Sqlite.Tests && ! -L trusted/tests/DSharp.Runtime.Sqlite.Tests && ! -e trusted/tests/sqlite-features && ! -L trusted/tests/sqlite-features ]]; then
            echo '::notice::Base revision predates SQLite setup; the proposed verifier and pilot are required below.'
          else
            echo '::error::Base SQLite verification setup is incomplete or unsafe.'
            exit 1
          fi
      - name: Verify SQLite with the proposed harness
        run: |
          set -euo pipefail
          test -f candidate/.github/ai/verify-sqlite.mjs && test ! -L candidate/.github/ai/verify-sqlite.mjs
          node candidate/.github/ai/verify-sqlite.mjs "$GITHUB_WORKSPACE/candidate" "$RUNNER_TEMP/sqlite-candidate-reports"
      - name: Prove SQLite verifier rejects a failing feature
        run: |
          set -euo pipefail
          test -f candidate/.github/ai/sqlite-pilot.mjs && test ! -L candidate/.github/ai/sqlite-pilot.mjs
          node candidate/.github/ai/sqlite-pilot.mjs "$RUNNER_TEMP/sqlite-pilot-reports"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sqlite-verification
          path: |
            ${{ runner.temp }}/sqlite-base-reports/
            ${{ runner.temp }}/sqlite-candidate-reports/
            ${{ runner.temp }}/sqlite-pilot-reports/
          if-no-files-found: error
          retention-days: 14
