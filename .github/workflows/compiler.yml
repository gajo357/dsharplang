name: Compiler
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      # TRX repeats the assembly's absolute path for every test. A short,
      # exact-commit checkout keeps the report within the existing size guard.
      - name: Run compiler verifier from a short checkout
        run: |
          set -euo pipefail
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          short_checkout="$(mktemp -d /tmp/XXX)"
          git clone --quiet --no-hardlinks --no-checkout "$GITHUB_WORKSPACE" "$short_checkout"
          git -C "$short_checkout" checkout --quiet --detach "$GITHUB_SHA"
          test "$(git -C "$short_checkout" rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git -C "$short_checkout" status --porcelain)"
          cd "$short_checkout"
          COMPILER_REPORT_DIR="$GITHUB_WORKSPACE/artifacts/compiler" bash scripts/verify-compiler.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: compiler-tests
          path: artifacts/compiler/
          if-no-files-found: error
